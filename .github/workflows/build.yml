name: Build installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write          # lets the tag build attach the installer to a GitHub Release
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: choco install innosetup -y --no-progress
      - run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          cmd /c build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Glowdeck-Setup
          path: installer_out/Glowdeck-Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_out/Glowdeck-Setup.exe
          generate_release_notes: true
          body: |
            Download **Glowdeck-Setup.exe** below and run it. Windows SmartScreen may warn because the installer is
            not code-signed: choose "More info", then "Run anyway".
